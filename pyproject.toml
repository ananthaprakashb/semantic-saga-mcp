[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-saga-mcp"
dynamic = ["version"]
description = "An MCP server for durable saga execution and compensating rollbacks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["mcp", "saga", "transactions", "rollback", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anyio>=4,<5",
    "mcp>=2.1,<3",
    "pydantic>=2.7,<3",
    "starlette>=0.37,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
semantic-saga-mcp = "semantic_saga_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "semantic_saga_mcp.__version__"}

[tool.setuptools.package-data]
semantic_saga_mcp = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
