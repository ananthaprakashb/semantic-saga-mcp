[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-saga-mcp"
version = "0.1.0"
description = "An MCP server for durable saga execution and compensating rollbacks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.7,<3",
    "starlette>=0.37,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
semantic-saga-mcp = "semantic_saga_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
