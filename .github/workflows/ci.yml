name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  transport-smoke:
    name: MCP 2026 transport smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - name: Verify Streamable HTTP is modern and transport-stateless
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/semantic-saga-http.log"
          DB="$RUNNER_TEMP/semantic-saga.db"
          semantic-saga-mcp --transport streamable-http --host 127.0.0.1 --port 8123 --database "$DB" >"$LOG" 2>&1 &
          pid=$!
          trap 'rc=$?; kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; if [ "$rc" -ne 0 ]; then cat "$LOG"; fi; exit "$rc"' EXIT

          python - <<'PY'
          import socket
          import time

          for _ in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 8123), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("Streamable HTTP server did not become ready")
          PY

          python - <<'PY'
          import asyncio
          from mcp import Client

          URL = "http://127.0.0.1:8123/mcp"

          async def main() -> None:
              async with Client(URL) as first:
                  assert first.protocol_version == "2026-07-28", first.protocol_version
                  created = await first.call_tool("begin_saga", {"metadata": {"smoke": True}})
                  assert not created.is_error, created
                  saga_id = created.structured_content["id"]

              # A completely new HTTP client must still reach the same saga by
              # explicit handle. Ownership is no longer tied to a transport session.
              async with Client(URL) as second:
                  assert second.protocol_version == "2026-07-28", second.protocol_version
                  fetched = await second.call_tool("get_saga", {"saga_id": saga_id})
                  assert not fetched.is_error, fetched
                  assert fetched.structured_content["id"] == saga_id
                  assert fetched.structured_content["status"] == "ACTIVE"

          asyncio.run(main())
          PY

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
